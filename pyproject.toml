[project]
name = "noteworthy"
version = "0.3.0"
description = "Typst document builder with TUI, CLI, and web GUI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pycrdt>=0.8.0",
    "pycrdt-websocket>=0.12.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The web GUI (`noteworthy -g`) is Syncworthy with this package as a plugin.
# Not on PyPI yet: until it is, install a checkout next to this one
# (`pip install -e ../syncworthy`, or `uv sync --extra gui`, which reads
# [tool.uv.sources] below), or put it on PYTHONPATH.
gui = [
    "syncworthy",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
noteworthy = "noteworthy.__main__:main"

[project.entry-points."syncworthy.plugins"]
noteworthy = "noteworthy.syncworthy_plugin:NoteworthyPlugin"

[tool.uv.sources]
syncworthy = { path = "../syncworthy", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["noteworthy"]

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
