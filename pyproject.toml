[project]
name = "noteworthy"
version = "0.3.0"
description = "Typst document builder with TUI, CLI, and web GUI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pycrdt>=0.8.0",
    "pycrdt-websocket>=0.12.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# The web GUI (`noteworthy -g`) is Syncworthy with this package as a plugin
# (https://github.com/R0K0R/syncworthy, not on PyPI).  `pip install
# 'noteworthy[gui]'` / `uv sync --extra gui` fetch it from GitHub.  With a local
# checkout instead, `pip install -e ../syncworthy` or put it on PYTHONPATH
# (the nix dev shell does, see flake.nix and SYNCWORTHY_SRC).
gui = [
    "syncworthy @ git+https://github.com/R0K0R/syncworthy",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
noteworthy = "noteworthy.__main__:main"

[project.entry-points."syncworthy.plugins"]
noteworthy = "noteworthy.syncworthy_plugin:NoteworthyPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true   # the syncworthy git URL above

[tool.hatch.build.targets.wheel]
packages = ["noteworthy"]

[tool.ruff]
line-length = 120
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
